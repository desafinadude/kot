<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f0e6d2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Monster City" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <title>Monster City — Kaiju Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;900&family=Yuji+Syuku&family=Yusei+Magic&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/paper.css?v=8" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.20.0/matter.min.js"></script>
</head>
<body>
  <div id="app">

    <!-- ══════════ SETUP ══════════ -->
    <section id="screen-setup" class="screen">
      <header class="setup-head">
        <div class="setup-logo" id="setupLogo">👑</div>
        <h1>MONSTER CITY</h1>
        <p class="sub">怪獣 · Kaiju Edition — 6 titans · 4 districts · one throne</p>
      </header>

      <div class="setup-row">
        <span class="setup-label">Monsters</span>
        <div class="stepper">
          <button id="btnMinus" class="step-btn" aria-label="fewer">−</button>
          <span id="playerCount">2</span>
          <button id="btnPlus" class="step-btn" aria-label="more">+</button>
        </div>
      </div>

      <div class="setup-row">
        <span class="setup-label">Opponents</span>
        <div class="mode-toggle" id="modeToggle">
          <button class="mode-btn active" data-mode="bots">BOTS</button>
          <button class="mode-btn" data-mode="pass">PASS &amp; PLAY</button>
        </div>
      </div>

      <div class="monster-grid" id="monsterGrid"></div>

      <div class="setup-foot">
        <button id="btnStart" class="btn-primary" disabled>SELECT 2 MONSTERS</button>
        <p class="hint">Tap monsters in seat order. First player is drawn at random.<br/>Shake your phone (or tap) to roll the dice.</p>
      </div>
    </section>

    <!-- ══════════ GAME ══════════ -->
    <section id="screen-game" class="screen hidden">
      <header class="topbar">
        <div class="turn-chip" id="turnChip"></div>
        <button class="icon-btn" id="btnRules" title="Rules" aria-label="Rules">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.2a3 3 0 0 1 5.8 1c0 2-3 2.6-3 4.3"/><path d="M12 17.5h.01"/></svg>
        </button>
        <button class="icon-btn" id="btnLog" title="Log" aria-label="Log">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2.5H6.5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V8L14 2.5Z"/><path d="M14 2.5V8h5.5"/><path d="M8.5 13h7M8.5 17h7"/></svg>
        </button>
      </header>

      <div class="ticker" id="ticker"></div>
      <div class="announce-wrap" id="announceWrap" aria-live="polite"></div>

      <div class="map" id="map"></div>
      <div class="map-tip hidden" id="mapTip"></div>

      <div class="players" id="players"></div>

      <div class="abilities" id="abilities"></div>

      <div class="dice-tray" id="diceTray">
        <div class="dice-stage" id="diceStage">
          <div class="dice-faces" id="diceFaces"></div>
          <canvas class="dice-canvas hidden" id="diceCanvas"></canvas>
        </div>
        <div class="dice-hint" id="diceHint"></div>
      </div>

      <div class="actions">
        <div class="action-row">
          <button id="btnSecondary" class="btn-ghost hidden"></button>
          <button id="btnShop" class="btn-ghost hidden">🃏 Shop</button>
        </div>
        <button id="btnPrimary" class="btn-primary">ROLL</button>
      </div>
    </section>

    <!-- ══════════ OVERLAYS ══════════ -->
    <div class="backdrop hidden" id="backdrop"></div>

    <div class="sheet hidden" id="sheetShop">
      <div class="sheet-grip"></div>
      <div class="sheet-head">
        <h2>Card Market</h2>
        <div class="energy-pill" id="shopEnergy">⚡ 0</div>
        <button class="sheet-close" data-close>✕</button>
      </div>
      <div class="sheet-note" id="shopNote"></div>
      <div class="card-list" id="cardList"></div>
      <button class="btn-ghost wide" id="btnSweep">Sweep the market · 2 Energy</button>
    </div>

    <div class="sheet hidden" id="sheetLog">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2>City Log</h2><button class="sheet-close" data-close>✕</button></div>
      <div class="log-list" id="logList"></div>
    </div>

    <div class="sheet hidden" id="sheetRules">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2>Rules &amp; Districts</h2><button class="sheet-close" data-close>✕</button></div>
      <div class="rules-body" id="rulesBody"></div>
    </div>

    <div class="modal-wrap hidden" id="modal"></div>

    <div class="win-overlay hidden" id="winOverlay"></div>
  </div>

  <script type="module" src="js/main.js?v=8"></script>
</body>
</html>
